# Global dev toolchain: mise owns runtimes and dev CLIs; Homebrew owns system
# packages. Never use `npm i -g`, `bun add -g`, or other global installers —
# declare tools here with `mise use -g <tool>` instead.
#
# CLI tools from npm use mise's npm backend, so each lives in its own mise
# install dir and is reachable through mise shims rather than a global npm/bun
# bin directory. Versions are pinned to the exact versions that were migrated
# from the old global installs; run `mise outdated`/`mise up` to bump them.

[tools]
# Runtimes
java = "27.0.1"
node = "26.13.1"
python = "3.15"
bun = "1.4.5"

# Dev CLIs (migrated from Homebrew; pinned to the version that was installed)
act = "0.2.98"
actionlint = "1.7.12"
cargo-nextest = "0.9.152"
circleci = "1.18.0"
gh = "2.105.0"
gitleaks = "8.30.1"
glab = "1.133.0"
osv-scanner = "2.7.1"
pipx = "1.19.1"
ruff = "0.17.6"
sccache = "0.20.1"
shellcheck = "0.11.0"
solidity = "0.8.39"
supabase = "3.4.0"
uv = "0.13.10"
zizmor = "1.33.1"

# npm CLIs (formerly `bun add -g` / `npm i -g`)
"npm:@earendil-works/pi-coding-agent" = "1.6.1"
"npm:@graphprotocol/graph-cli" = "0.98.1"
"npm:@kilocode/cli" = "7.8.32"
"npm:@monid-ai/cli" = "0.1.9"
"npm:@openai/codex" = "0.172.0"
"npm:@opencode/cli" = { version = "2.4.1", allow_builds = ["@opencode/cli", "workerd"] }
"npm:@railway/cli" = { version = "5.75.0", allow_builds = ["@railway/cli"] }
"npm:cf" = "1.0.0-rc.6"
"npm:pi-acp" = "0.0.35"
"npm:portless" = "0.18.1"
"npm:tsx" = "4.23.15"
"npm:turbo" = "2.11.13"

[settings]
experimental = true
